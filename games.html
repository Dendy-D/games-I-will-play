<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Games I will play</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232433a8'/%3E%3Crect x='6' y='11' width='20' height='12' rx='6' fill='%23ffc83d'/%3E%3Cpath d='M10 17h5M12.5 14.5v5' stroke='%2310163f' stroke-width='2' stroke-linecap='round'/%3E%3Ccircle cx='20.5' cy='15.5' r='1.3' fill='%2310163f'/%3E%3Ccircle cx='22.5' cy='18.5' r='1.3' fill='%2310163f'/%3E%3C/svg%3E">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Onest:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="games.css">
</head>
<body>
  <header class="masthead">
    <a class="back" href="index.html">Main menu</a>
    <h1 class="title" id="top" tabindex="-1">Games I<br> will play</h1>
    <div class="toolbar">
      <p class="tally" id="tally" aria-live="polite"></p>
      <div class="filters" id="filters" role="group" aria-label="Show">
        <button type="button" data-filter="all" aria-pressed="true">All <span class="filter-count"></span></button>
        <button type="button" data-filter="unplayed" aria-pressed="false">To play <span class="filter-count"></span></button>
        <button type="button" data-filter="played" aria-pressed="false">Played <span class="filter-count"></span></button>
      </div>
      <label class="search">
        <span class="visually-hidden">Search games</span>
        <input type="search" id="search" placeholder="Search games" autocomplete="off" spellcheck="false">
      </label>
    </div>
  </header>

  <main>
    <ul class="shelf" id="shelf"></ul>
    <div class="empty" id="empty" hidden></div>
  </main>

  <footer class="saves">
    <div class="saves-box">
      <h2>Save data</h2>
      <p>Your Played ticks live in this browser, on this device. They won't appear in another browser or on your phone, and clearing site data erases them. Download a backup to move them or bring them back. One file covers both games and movies.</p>
      <p id="storage-note"></p>
      <div class="saves-actions">
        <button type="button" id="backup-download">Download backup</button>
        <button type="button" id="backup-restore">Restore from backup</button>
        <input type="file" id="backup-file" accept=".json,application/json" hidden>
      </div>
      <p class="saves-result" id="backup-result" role="status"></p>
    </div>
  </footer>

  <a class="to-top" id="to-top" href="#top" aria-label="Back to top">
    <svg viewBox="0 0 24 24" width="26" height="26" aria-hidden="true">
      <path d="M12 19V6M5.5 11.5 12 5l6.5 6.5" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </a>

  <template id="card-template">
    <li class="card">
      <a class="card-cover" target="_blank" rel="noopener noreferrer" tabindex="-1" aria-hidden="true">
        <img alt="" loading="lazy">
        <span class="cover-fallback"></span>
      </a>
      <div class="card-body">
        <h2 class="card-title"><a target="_blank" rel="noopener noreferrer"></a></h2>
        <p class="card-platform"></p>
        <p class="card-desc"></p>
        <div class="card-actions">
          <a class="play" target="_blank" rel="noopener noreferrer">Open game</a>
          <button class="played-toggle" type="button" aria-pressed="false">Played</button>
        </div>
      </div>
      <span class="stamp" aria-hidden="true">Played</span>
    </li>
  </template>

  <script src="games.js"></script>
  <script src="store.js"></script>
  <script src="games-app.js"></script>
  <script src="backup.js"></script>
</body>
</html>
